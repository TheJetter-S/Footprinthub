# A generic, single-database Alembic configuration.

[alembic]
# Path to migration environment
script_location = alembic

# Template used to generate migration file names
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Truncate long revision to keep filenames manageable
truncate_slug_length = 40

# Timezone for revision timestamps
timezone = UTC

# Database URL — overridden by env.py from settings
sqlalchemy.url = postgresql://footprinthub:changeme@localhost:5432/footprinthub
